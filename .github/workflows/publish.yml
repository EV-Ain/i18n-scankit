name: Publish to npm

# Publishes the package whenever you create a GitHub Release.
# Requirements:
#   1. Create an npm automation token: https://www.npmjs.com/settings/<you>/tokens
#   2. Add it to the repo as a secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: node --test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
